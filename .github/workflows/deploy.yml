name: Deploy web to GitHub Pages

# 推到預設分支時自動 build web/（Vite）並部署到 GitHub Pages。
# 啟用方式：在 GitHub repo → Settings → Pages → Source 選「GitHub Actions」。

on:
  push:
    branches: [main, master]
  workflow_dispatch: # 也可在 Actions 頁手動觸發

permissions:
  contents: read
  pages: write
  id-token: write

# 同時間只跑一次部署，新的 push 會取代排隊中的舊任務（不中斷進行中的）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
