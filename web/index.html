<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="立體四方塊 4 Cube Puzzle：國中科展的現代互動重製——88 種形狀即時求解、顏色排列研究與方塊套組設定。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Cpath d='M0 0H8V8H0Z' fill='%230c1220'/%3E%3Cpath d='M0 0H8L4 4Z' fill='%23e23b3b'/%3E%3Cpath d='M8 0V8L4 4Z' fill='%232f6bd8'/%3E%3Cpath d='M8 8H0L4 4Z' fill='%23f2c200'/%3E%3Cpath d='M0 8V0L4 4Z' fill='%232f6bd8'/%3E%3C/svg%3E" />
    <title>立體四方塊 · 4 Cube Puzzle</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header>
          <h1>立體四方塊</h1>
          <p class="subtitle">4 Cube Puzzle · 互動解法視覺化</p>
        </header>

        <div class="mode-toggle">
          <button id="mode-puzzle" class="mode-btn active">圖形拼圖</button>
          <button id="mode-color" class="mode-btn">顏色排列</button>
        </div>
        <div class="sub-toggle" id="puzzle-sub">
          <button id="sub-view" class="sub-btn active">看解答</button>
          <button id="sub-play" class="sub-btn">試玩</button>
        </div>

        <section class="panel" id="shape-panel">
          <label class="field-label">圖形 <span class="dim small">（全 88 種，★ 官方 13）</span></label>
          <div class="shapes-tabs" id="shape-tabs">
            <button class="shapes-tab active" data-t="face">面相連 8</button>
            <button class="shapes-tab" data-t="edge">含邊接觸 80</button>
          </div>
          <div id="shape-list" class="shape-pick-grid"></div>
        </section>

        <section class="panel" id="play-panel" hidden>
          <div class="row between">
            <span class="field-label">試玩：自己解解看</span>
            <span id="play-status" class="badge"></span>
          </div>
          <p class="small dim" style="margin:0 0 10px">點選一個方塊使其發亮，再用下方按鈕旋轉它，讓所有相接面顏色一致。</p>
          <div class="rot-controls">
            <div class="rot-axis"><span>繞 X</span><button class="rbtn" data-ax="x" data-dir="-1">↺</button><button class="rbtn" data-ax="x" data-dir="1">↻</button></div>
            <div class="rot-axis"><span>繞 Y</span><button class="rbtn" data-ax="y" data-dir="-1">↺</button><button class="rbtn" data-ax="y" data-dir="1">↻</button></div>
            <div class="rot-axis"><span>繞 Z</span><button class="rbtn" data-ax="z" data-dir="-1">↺</button><button class="rbtn" data-ax="z" data-dir="1">↻</button></div>
          </div>
          <button id="play-swap" class="btn-wide" style="width:100%; margin-top:8px">🔄 交換方塊位置（點兩顆）</button>
          <div id="play-win" class="win-banner" hidden>🎉 解出來了！</div>
          <div class="row" style="margin-top:10px; gap:8px">
            <button id="play-scramble" class="btn-wide">打亂重玩</button>
            <button id="play-reveal" class="btn-wide">直接看解</button>
          </div>
        </section>

        <section class="panel">
          <label class="field-label">題目形狀</label>
          <figure class="ref-gray"><canvas id="ref-problem-iso"></canvas></figure>
        </section>

        <section class="panel view-only">
          <div class="row between">
            <span class="field-label">解答</span>
            <span id="solution-count" class="badge"></span>
          </div>
          <div class="row">
            <button id="prev-sol" class="btn">‹</button>
            <input id="sol-slider" type="range" min="0" max="0" value="0" />
            <button id="next-sol" class="btn">›</button>
          </div>
          <div id="solution-info" class="mono small"></div>
        </section>

        <section class="panel view-only">
          <label class="field-label">解的數量：排列數 vs 組合數</label>
          <div class="stat-row"><span>總嘗試空間</span><b id="stat-total">—</b></div>
          <div class="stat-row"><span>排列數（合法排法）</span><b id="stat-raw">—</b></div>
          <div class="stat-row"><span>組合數（對稱化簡）</span><b id="stat-reduced">—</b></div>
          <div id="stat-note" class="mono small dim"></div>
        </section>

        <section class="panel">
          <label class="field-label">顯示</label>
          <label class="check"><input type="checkbox" id="toggle-spread" /> 方塊間距（拉開看內部）</label>
          <label class="check"><input type="checkbox" id="toggle-spin" /> 自動旋轉</label>
          <label class="check"><input type="checkbox" id="toggle-edges" checked /> 顯示邊框</label>
          <label class="check"><input type="checkbox" id="toggle-labels" checked /> 顯示甲乙丙丁標籤</label>
        </section>

        <section class="panel legend">
          <label class="field-label">顏色對應</label>
          <div class="legend-row"><span class="swatch" style="background:#e23b3b"></span> 紅 R = 2</div>
          <div class="legend-row"><span class="swatch" style="background:#f2c200"></span> 黃 Y = 1</div>
          <div class="legend-row"><span class="swatch" style="background:#2f6bd8"></span> 藍 B = 0</div>
          <div class="legend-row dim">甲乙丙丁＝四個方塊</div>
        </section>

        <footer class="credit">
          原始研究：張頌宇 · 謝荏全 · 蕭亦淳（國中科展）<br />
          現代重製：TypeScript + Three.js
        </footer>
      </aside>

      <main id="stage">
        <div id="canvas-host"></div>
        <div id="hud" class="mono small"></div>
        <div id="study-view" hidden></div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
